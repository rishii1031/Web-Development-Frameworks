<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Hub</title>


<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#f4f6f9;
}

header{
    background:#004080;
    color:white;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:15px 50px;
}

header h1{
    font-size:28px;
}

nav a{
    color:white;
    text-decoration:none;
    margin-left:20px;
    font-weight:bold;
}

nav a:hover{
    color:gold;
}

.hero{
    display:flex;
    justify-content:center;
    align-items:center;
    height:80vh;
    text-align:center;
    background:linear-gradient(to right,#007BFF,#5497e3);
    color:white;
}

.hero-content{
    max-width:700px;
}

.hero h2{
    font-size:45px;
    margin-bottom:20px;
}

.hero p{
    font-size:20px;
    margin-bottom:30px;
}

.btn{
    display:inline-block;
    padding:12px 30px;
    background:white;
    color:#007BFF;
    text-decoration:none;
    border-radius:5px;
    font-weight:bold;
    margin:10px;
}

.btn:hover{
    background:#004080;
    color:white;
}

footer{
    background:#004080;
    color:white;
    text-align:center;
    padding:15px;
}
</style>
</head>
<body>

<header>
    <h1>STUDENT HUB</h1>

    <nav>
        <a href="index.html">Home</a>
        <a href="login.html">Login</a>
        <a href="register.html">Register</a>
        <a href="dashboard.html">Dashboard</a>
    </nav>
</header>

<section class="hero">

<div class="hero-content">

<h2>Welcome to Student Hub</h2>

<p>
Your all-in-one platform for academics, attendance,
courses, notices, events, and campus activities.
</p>

<a href="login.html" class="btn">Login</a>

<a href="register.html" class="btn">Register</a>

</div>

</section>

<footer>

<p>© 2026 Student Hub. All Rights Reserved.</p>

</footer>

</html>
