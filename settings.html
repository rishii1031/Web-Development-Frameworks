<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Hub - Settings</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f4f6f9;
}

.container{
    display:flex;
    min-height:100vh;
}

/* Sidebar */

.sidebar{
    width:250px;
    background:#004080;
    color:white;
    padding:20px;
}

.sidebar h2{
    text-align:center;
    margin-bottom:30px;
}

.profile{
    text-align:center;
    margin-bottom:30px;
}

.profile img{
    width:80px;
    height:80px;
    border-radius:50%;
    background:white;
}

.profile h3{
    margin-top:10px;
}

.sidebar ul{
    list-style:none;
}

.sidebar ul li{
    margin:15px 0;
}

.sidebar ul li a{
    color:white;
    text-decoration:none;
    display:block;
    padding:10px;
    border-radius:5px;
}

.sidebar ul li a:hover{
    background:#0066cc;
}

/* Main Content */

.main{
    flex:1;
    padding:30px;
}

.main h1{
    color:#004080;
    margin-bottom:25px;
}

/* Settings Box */

.settings-box{
    width:600px;
    background:white;
    padding:30px;
    border-radius:10px;
    box-shadow:0 4px 8px rgba(0,0,0,.1);
}

.settings-box h2{
    color:#004080;
    text-align:center;
    margin-bottom:25px;
}

label{
    display:block;
    margin-top:15px;
    margin-bottom:8px;
    font-weight:bold;
}

input{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:5px;
    font-size:15px;
}

button{
    width:100%;
    padding:12px;
    margin-top:25px;
    background:#004080;
    color:white;
    border:none;
    border-radius:5px;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    background:#0066cc;
}

</style>

</head>

<body>

<div class="container">

<!-- Sidebar -->

<div class="sidebar">

<h2>STUDENT HUB</h2>

<div class="profile">

<img src="https://via.placeholder.com/80" alt="Student">

<h3>Student Name</h3>

</div>

<ul>

<li><a href="dashboard.html">Dashboard</a></li>

<li><a href="profile.html">Profile</a></li>

<li><a href="courses.html">Courses</a></li>

<li><a href="attendance.html">Attendance</a></li>

<li><a href="notices.html">Notices</a></li>

<li><a href="feedback.html">Feedback</a></li>

<li><a href="settings.html">Settings</a></li>

<li><a href="login.html">Logout</a></li>

</ul>

</div>

<!-- Main Content -->

<div class="main">

<h1>Settings</h1>

<div class="settings-box">

<h2>Change Password</h2>

<form>

<label>Current Password</label>
<input type="password" placeholder="Enter Current Password">

<label>New Password</label>
<input type="password" placeholder="Enter New Password">

<label>Confirm New Password</label>
<input type="password" placeholder="Confirm New Password">

<button type="submit">Update Password</button>

</form>

</div>

</div>

</div>

</body>
</html>
