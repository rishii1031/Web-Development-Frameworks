<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Hub - Feedback</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#f4f6f9;
}

.container{
    display:flex;
    min-height:100vh;
}

/* Sidebar */

.sidebar{
    width:250px;
    background:#004080;
    color:white;
    padding:20px;
}

.sidebar h2{
    text-align:center;
    margin-bottom:30px;
}

.profile{
    text-align:center;
    margin-bottom:30px;
}

.profile img{
    width:80px;
    height:80px;
    border-radius:50%;
    background:white;
}

.profile h3{
    margin-top:10px;
}

.sidebar ul{
    list-style:none;
}

.sidebar ul li{
    margin:15px 0;
}

.sidebar ul li a{
    color:white;
    text-decoration:none;
    display:block;
    padding:10px;
    border-radius:5px;
}

.sidebar ul li a:hover{
    background:#0066cc;
}

/* Main Content */

.main{
    flex:1;
    padding:30px;
}

.main h1{
    color:#004080;
    margin-bottom:25px;
}

/* Feedback Box */

.feedback-box{
    background:white;
    width:600px;
    margin:auto;
    padding:30px;
    border-radius:10px;
    box-shadow:0 4px 8px rgba(0,0,0,.1);
}

.feedback-box h2{
    text-align:center;
    color:#004080;
    margin-bottom:10px;
}

.feedback-box p{
    text-align:center;
    margin-bottom:25px;
    color:#555;
}

label{
    display:block;
    margin-bottom:8px;
    margin-top:15px;
    font-weight:bold;
}

select,
textarea{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:5px;
    font-size:15px;
}

textarea{
    resize:none;
    height:120px;
}

button{
    width:100%;
    padding:12px;
    margin-top:20px;
    background:#004080;
    color:white;
    border:none;
    border-radius:5px;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    background:#0066cc;
}

</style>

</head>

<body>

<div class="container">

<div class="sidebar">

<h2>STUDENT HUB</h2>

<div class="profile">

<img src="https://via.placeholder.com/80" alt="Student">

<h3>Rishi Kesur</h3>

</div>

<ul>

<li><a href="dashboard.html">Dashboard</a></li>

<li><a href="profile.html">Profile</a></li>

<li><a href="courses.html">Courses</a></li>

<li><a href="attendance.html">Attendance</a></li>

<li><a href="notices.html">Notices</a></li>

<li><a href="feedback.html">Feedback</a></li>

<li><a href="settings.html">Settings</a></li>

<li><a href="login.html">Logout</a></li>

</ul>

</div>

<div class="main">

<h1>Feedback</h1>

<div class="feedback-box">

<h2>We Value Your Feedback</h2>

<p>Please share your valuable feedback.</p>

<form>

<label>Subject</label>

<select>
<option>Select Subject</option>
<option>Data Structure</option>
<option>Operating System</option>
<option>Computer Networking</option>
<option>Web Development</option>
</select>

<label>Rating</label>

<select>
<option>Select Rating</option>
<option>⭐⭐⭐⭐⭐ Excellent</option>
<option>⭐⭐⭐⭐ Good</option>
<option>⭐⭐⭐ Average</option>
<option>⭐⭐ Poor</option>
<option>⭐Very Poor</option>
</select>

<label>Your Feedback</label>

<textarea placeholder="Write your valuable feedback here..."></textarea>

<button type="submit">Send Feedback</button>

</form>


</div>


</div>

</div>

</body>
</html>
