<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Hub - Courses</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f4f6f9;
}

.container{
    display:flex;
    min-height:100vh;
}

/* Sidebar */

.sidebar{
    width:250px;
    background:#004080;
    color:white;
    padding:20px;
}

.sidebar h2{
    text-align:center;
    margin-bottom:30px;
}

.profile{
    text-align:center;
    margin-bottom:30px;
}

.profile img{
    width:80px;
    height:80px;
    border-radius:50%;
    background:white;
}

.profile h3{
    margin-top:10px;
}

.sidebar ul{
    list-style:none;
}

.sidebar ul li{
    margin:15px 0;
}

.sidebar ul li a{
    color:white;
    text-decoration:none;
    display:block;
    padding:10px;
    border-radius:5px;
}

.sidebar ul li a:hover{
    background:#0066cc;
}

/* Main */

.main{
    flex:1;
    padding:30px;
}

.main h1{
    color:#004080;
    margin-bottom:25px;
}

/* Table */

.course-table{
    background:white;
    border-radius:10px;
    box-shadow:0 4px 8px rgba(0,0,0,.1);
    overflow:hidden;
}

table{
    width:100%;
    border-collapse:collapse;
}

th{
    background:#004080;
    color:white;
    padding:15px;
}

td{
    padding:15px;
    text-align:center;
    border-bottom:1px solid #ddd;
}

tr:hover{
    background:#f2f2f2;
}

.view-btn{
    background:#004080;
    color:white;
    padding:8px 15px;
    text-decoration:none;
    border-radius:5px;
}

.view-btn:hover{
    background:#0066cc;
}

</style>

</head>

<body>

<div class="container">

<!-- Sidebar -->

<div class="sidebar">

<h2>STUDENT HUB</h2>

<div class="profile">

<img src="https://via.placeholder.com/80" alt="Student">

<h3>Rishi Kesur</h3>

</div>

<ul>

<li><a href="dashboard.html">Dashboard</a></li>

<li><a href="profile.html">Profile</a></li>

<li><a href="courses.html">Courses</a></li>

<li><a href="attendance.html">Attendance</a></li>

<li><a href="notices.html">Notices</a></li>

<li><a href="feedback.html">Feedback</a></li>

<li><a href="settings.html">Settings</a></li>

<li><a href="login.html">Logout</a></li>

</ul>

</div>

<!-- Main Content -->

<div class="main">

<h1>Courses</h1>

<div class="course-table">

<table>

<tr>
<th>#</th>
<th>Course Code</th>
<th>Course Name</th>
<th>Action</th>
</tr>

<tr>
<td>1</td>
<td>CO1</td>
<td>Data Structure</td>
<td><a href="#" class="view-btn">View</a></td>
</tr>

<tr>
<td>2</td>
<td>CO2</td>
<td>Web Development</td>
<td><a href="#" class="view-btn">View</a></td>
</tr>

<tr>
<td>3</td>
<td>CO3</td>
<td>Discrete Maths</td>
<td><a href="#" class="view-btn">View</a></td>
</tr>

<tr>
<td>4</td>
<td>CO4</td>
<td>Computer Networking</td>
<td><a href="#" class="view-btn">View</a></td>
</tr>

</table>

</div>

</div>

</div>

</body>
</html>
